<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clean &amp; Care | Laundry &amp; Dry Cleaning</title>
    <meta
      name="description"
      content="Clean & Care - India's laundry and dry-cleaning brand offering doorstep pickup & drop, dry cleaning, wet cleaning, steam ironing and home care services."
    />

    <link rel="icon" type="image/png" href="/images/favicon-32.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />

    <!-- Open Graph / Twitter Card — what shows up when a link to the site
         is shared on WhatsApp (the business's main sharing channel), plus
         Facebook/Twitter. og:image and og:url need to be absolute, fetchable
         URLs, not relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clean & Care" />
    <meta property="og:title" content="Clean & Care | Laundry & Dry Cleaning" />
    <meta
      property="og:description"
      content="India's laundry and dry-cleaning brand offering doorstep pickup & drop, dry cleaning, wet cleaning, steam ironing and home care services."
    />
    <meta property="og:url" content="https://cleanandcaremotera.github.io/" />
    <meta property="og:image" content="https://cleanandcaremotera.github.io/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clean & Care | Laundry & Dry Cleaning" />
    <meta
      name="twitter:description"
      content="India's laundry and dry-cleaning brand offering doorstep pickup & drop, dry cleaning, wet cleaning, steam ironing and home care services."
    />
    <meta name="twitter:image" content="https://cleanandcaremotera.github.io/images/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <!-- Decodes the redirect from 404.html back into a real path for React Router.
         Counterpart of public/404.html; see that file for why this exists. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
